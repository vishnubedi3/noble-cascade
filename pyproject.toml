[build-system]
requires = ["setuptools>=68,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "noble-cascade"
version = "0.2.0"
description = "Policy-governed control plane for authorized security research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.15,<3",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
]

[project.scripts]
noble = "noble.cli:main"

[tool.setuptools]
packages = ["noble", "noble.builtins"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/fixtures/**" = ["ALL"]
"noble/execution.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests",
    "integration: end-to-end control plane flows",
    "security: adversarial / bypass resistance tests",
    "regression: previously discovered defects",
    "invariants: automated security invariants",
]
