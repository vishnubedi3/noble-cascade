[build-system]
requires = ["setuptools>=68,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "noble-cascade"
version = "0.2.0"
description = "Policy-governed control plane for authorized security research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.15,<3",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
]

[project.scripts]
noble = "noble.cli:main"

[tool.setuptools]
packages = ["noble", "noble.builtins"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["E501", "S110", "S112", "E741", "B007", "S108", "B905", "SIM105", "E722", "B011", "SIM222", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "E741", "B007", "B011", "S110", "B905", "F841"]
"agent-skills/tests/**" = ["S101", "S603"]  # legacy validation script: asserts + fixed-argv subprocess, mirrors tests/** rationale
"tests/fixtures/**" = ["ALL"]
"noble/execution.py" = ["S603"]
"noble/backup.py" = ["S110", "F841"]
"noble/doctor.py" = ["S110", "S112", "F841", "SIM105"]
"noble/drift.py" = ["S110", "SIM105"]
"noble/engine.py" = ["S110", "S112"]
"noble/health.py" = ["S110"]
"noble/observability.py" = ["S110", "SIM105"]
"noble/replay.py" = ["S110", "F841"]
"noble/scorecard.py" = ["S110", "F841"]
"noble/spec.py" = ["B007"]
"noble/supply_chain.py" = ["E741"]
"noble/cli.py" = ["S603", "S607", "S110", "S112", "E741", "F841"]
"noble/sbom.py" = ["S603", "S607", "F841", "E741", "SIM401"]
"noble/provenance.py" = ["S603", "S607"]
"noble/release.py" = ["S603", "S607", "S110"]
"noble/attest.py" = ["S110"]
"noble/certify.py" = ["S110"]
"noble/audit_pack.py" = ["S603", "S607", "S110"]
"noble/policy_diff.py" = ["S603", "S607"]
"noble/trust_report.py" = ["S603", "S607", "S110"]
"noble/trust_index.py" = ["S603", "S607"]
"noble/benchmark.py" = ["S603", "S607", "S110"]
"noble/ledger_integrity.py" = ["S110"]
"noble/platform.py" = ["S110", "S103"]
"noble/compliance.py" = ["S110"]
"noble/governance.py" = ["S603", "S607", "S110"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests",
    "integration: end-to-end control plane flows",
    "security: adversarial / bypass resistance tests",
    "regression: previously discovered defects",
    "invariants: automated security invariants",
]
