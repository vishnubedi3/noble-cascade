# Reference-only, offline containment example — NOT an operational execution
# backend. The Python runtime never launches this compose service. Do not use
# this file as evidence that Docker isolation was tested or network-filtered.
services:
  agent-sandbox:
    image: debian:bookworm-slim
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: 1
    volumes:
      - ../../../:/workspace:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      - HOME=/tmp
    command: ["sleep", "infinity"]
